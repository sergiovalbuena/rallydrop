# Hourly jobs for RallyDrop: deposit holds placed 24 h before each rental,
# reminders for tomorrow's bookings (daytime only) and cleanup of unpaid
# holds. Calls the app's /api/cron/all endpoint.
#
# Repo secrets needed (Settings → Secrets and variables → Actions):
#   SITE_URL     e.g. https://rallydrop.ca  (no trailing slash)
#   CRON_SECRET  same value as the CRON_SECRET env var in Vercel
name: Scheduled jobs

on:
  schedule:
    # Every hour at :07. Card holds are placed ~24 h before each rental starts,
    # so they last through the rental (a saved-card hold is valid ~4.75 days on
    # Visa). GitHub may start scheduled runs a few minutes late; the jobs allow for it.
    - cron: "7 * * * *"
  workflow_dispatch: # "Run workflow" button for manual runs

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/all
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Add the SITE_URL and CRON_SECRET repository secrets."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 30 --retry-all-errors --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/all"
          echo
